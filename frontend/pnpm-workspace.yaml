# pnpm 10.x 设置项
#
# 说明：pnpm 10.16 起，供应链与依赖校验类设置改由此文件承载，
# .npmrc 中的同名键对 pnpm run 前的隐式 install 不生效。
#
# minimumReleaseAge：默认拒绝安装发布不足一定时长的包（供应链保护，
# 防御投毒包秒发秒装）。本项目依赖 Vue 3.5.45 等刚发布的版本，
# 保持默认会被拦截并报 ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION。
# 设为 0 关闭；生产项目建议改为 60（分钟）或保留默认 1440（分钟）。
minimumReleaseAge: 0

# 关闭 run 脚本前的自动依赖校验。
# 保持开启时，pnpm dev 会先跑一次 install，若该 install 失败，
# 脚本根本执行不到 vite，表现为 "'vite' 不是内部或外部命令"。
verifyDepsBeforeRun: false