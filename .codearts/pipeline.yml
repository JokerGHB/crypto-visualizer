# 华为云 CodeArts 流水线配置
#
# 阶段：静态检查 → 后端测试 → 前端测试 → 构建 → 制品归档
# 任一步失败即中断，避免带病发布。
version: 1.0
name: crypto-visualizer-ci

triggers:
  - type: push
    branches:
      - master
      - develop
  - type: merge_request
    events:
      - open
      - update

variables:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

stages:
  - name: 代码检查
    jobs:
      - name: lint-backend
        image: python:3.12-slim
        steps:
          - checkout
          - sh: |
              pip install --no-cache-dir ruff
              ruff check backend/app backend/tests

      - name: typecheck-frontend
        image: node:20-alpine
        steps:
          - checkout
          - sh: |
              cd frontend
              corepack enable
              pnpm install --frozen-lockfile
              pnpm typecheck

  - name: 单元测试
    jobs:
      - name: test-backend
        image: python:3.12-slim
        steps:
          - checkout
          - sh: |
              pip install --no-cache-dir -r backend/requirements.txt
              cd backend
              pytest -q --junitxml=../reports/backend.xml
        reports:
          - type: junit
            path: reports/backend.xml

      - name: test-frontend
        image: node:20-alpine
        steps:
          - checkout
          - sh: |
              cd frontend
              corepack enable
              pnpm install --frozen-lockfile
              pnpm test
        reports:
          - type: junit
            path: frontend/test-results.xml

  - name: 构建
    jobs:
      - name: build-frontend
        image: node:20-alpine
        steps:
          - checkout
          - sh: |
              cd frontend
              corepack enable
              pnpm install --frozen-lockfile
              pnpm build
        artifacts:
          - name: frontend-dist
            path: frontend/dist

      - name: build-images
        image: docker:24
        services:
          - docker
        steps:
          - checkout
          - sh: |
              docker build -t crypto-visualizer-backend:$BUILD_NUMBER ./backend
              docker build -t crypto-visualizer-frontend:$BUILD_NUMBER ./frontend
        # 镜像推送需在流水线变量中配置 SWR 凭据
        # - sh: |
        #     docker login -u $SWR_USER -p $SWR_PASSWORD $SWR_REGISTRY
        #     docker tag crypto-visualizer-backend:$BUILD_NUMBER $SWR_REGISTRY/$SWR_ORG/backend:$BUILD_NUMBER
        #     docker push $SWR_REGISTRY/$SWR_ORG/backend:$BUILD_NUMBER

  - name: 交付
    jobs:
      - name: publish-artifact
        image: alpine:3.20
        steps:
          - sh: |
              echo "构建号: $BUILD_NUMBER"
              echo "制品: frontend-dist 已归档"
        artifacts:
          - name: build-info
            path: reports