services:
  backend:
    build:
      context: ./backend
    container_name: crypto-visualizer-backend
    restart: unless-stopped
    environment:
      # 生产务必替换为随机值：openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:-please-change-this-in-production}
      DEBUG: ${DEBUG:-false}
      # 容器内用 MySQL；如需 SQLite 改为 sqlite:///./data/crypto_visualizer.db
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://crypto:${MYSQL_PASSWORD:-cryptopass}@db:3306/crypto_visualizer?charset=utf8mb4}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT: ${AI_TIMEOUT:-10}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-20}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net
    # 不对外暴露端口，只允许经前端 Nginx 访问
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    container_name: crypto-visualizer-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - app-net

  db:
    image: mysql:8.0
    container_name: crypto-visualizer-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: crypto_visualizer
      MYSQL_USER: crypto
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cryptopass}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-net

volumes:
  db-data:

networks:
  app-net:
    driver: bridge